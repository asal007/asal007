services:
  - type: web
    name: meinimmokauf
    runtime: python
    pythonVersion: 3.13
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: sh -c 'streamlit run app.py --server.port=8501 --server.address=0.0.0.0'
    envVars:
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_ENABLECORS
        value: "false"
      - key: STREAMLIT_LOGGER_LEVEL
        value: "info"
