<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Hintergrund -->
  <rect width="200" height="200" fill="#0f172a" rx="20"/>
  
  <!-- Haus-Umriss (Hauptform) -->
  <path d="M 50 120 L 50 90 L 100 50 L 150 90 L 150 120 Z" fill="#00c49a" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Dach-Akzent -->
  <path d="M 100 50 L 140 85 L 60 85 Z" fill="#00d4aa" opacity="0.8"/>
  
  <!-- Fenster oben links -->
  <rect x="65" y="70" width="20" height="20" fill="#1f2937" stroke="#00c49a" stroke-width="1.5"/>
  
  <!-- Fenster oben rechts -->
  <rect x="115" y="70" width="20" height="20" fill="#1f2937" stroke="#00c49a" stroke-width="1.5"/>
  
  <!-- Tür -->
  <rect x="90" y="100" width="20" height="30" fill="#1f2937" stroke="#00c49a" stroke-width="1.5"/>
  <!-- Türklinke -->
  <circle cx="107" cy="115" r="2" fill="#00c49a"/>
  
  <!-- Fenster unten links -->
  <rect x="65" y="105" width="15" height="15" fill="#1f2937" stroke="#00c49a" stroke-width="1.5"/>
  
  <!-- Fenster unten rechts -->
  <rect x="120" y="105" width="15" height="15" fill="#1f2937" stroke="#00c49a" stroke-width="1.5"/>
  
  <!-- Schornstein -->
  <rect x="130" y="55" width="8" height="25" fill="#e5e7eb" stroke="#00c49a" stroke-width="1"/>
  
  <!-- Dekoratives Element - Stern über dem Dach -->
  <circle cx="100" cy="35" r="4" fill="#fbbf24"/>
</svg>
